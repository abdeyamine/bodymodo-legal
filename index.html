<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bodymodo — Legal</title>
<style>
  body {
    margin: 0;
    background: #F8FAFC;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #0F172A;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    max-width: 480px;
    margin: 24px;
    padding: 40px 32px;
    background: white;
    border-radius: 12px;
    border: 1px solid #E2E8F0;
    text-align: center;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    color: #4F46E5;
    font-size: 20px;
    margin-bottom: 8px;
  }
  .brand-dot {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, #4A44F0, #1F0E81);
    border-radius: 8px;
  }
  h1 {
    font-size: 22px;
    margin: 16px 0 8px;
    letter-spacing: -0.01em;
  }
  p {
    color: #475569;
    margin: 0 0 24px;
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
    text-align: left;
  }
  li {
    border-top: 1px solid #E2E8F0;
  }
  a {
    display: block;
    padding: 16px 4px;
    color: #4F46E5;
    text-decoration: none;
    font-weight: 500;
  }
  a:hover { color: #3730A3; }
  .arrow { float: right; opacity: 0.5; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="brand-dot"></span>Bodymodo</div>
  <h1>Legal</h1>
  <p>Documents about how Bodymodo handles your data.</p>
  <ul>
    <li><a href="privacy-policy.html">Privacy Policy <span class="arrow">→</span></a></li>
  </ul>
</div>
</body>
</html>
